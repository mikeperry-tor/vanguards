[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vanguards"
dynamic = ["version"]
description = "Additional defenses for Tor onion services"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mike Perry"}]
dependencies = ["stem>=1.8.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/mikeperry-tor/vanguards"

[project.scripts]
vanguards = "vanguards.main:main"

[tool.setuptools.dynamic]
version = {attr = "vanguards.__init__.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
